<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>Celia Voice Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;font-family:Tahoma,Arial,sans-serif;
 background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center}
h1{color:#f3b43f}
p{line-height:1.8}
button,select{font:inherit}
select{padding:10px;border-radius:10px;max-width:100%}
.mic{width:120px;height:120px;border:0;border-radius:50%;background:#4a90e2;
 color:white;font-size:48px;margin:22px;cursor:pointer;box-shadow:0 0 20px #4a90e266}
.mic.listening{background:#e74c3c;animation:pulse 1s infinite}
.mic:disabled{opacity:.45;cursor:not-allowed}
@keyframes pulse{50%{transform:scale(1.07)}}
.box{width:min(100%,500px);min-height:90px;padding:18px;margin-top:12px;
 border-radius:14px;background:#ffffff15;border:1px solid #ffffff30;
 overflow-wrap:anywhere;line-height:1.8}
#result{font-weight:bold}
.good{color:#54e69a}.bad{color:#ffd166}
.hint{font-size:14px;color:#d1d5db}
</style>
</head>
<body>
<h1>Celia Voice Lab 🎙️</h1>
<p>اختر الكلمة، ثم اضغط الميكروفون وانطقها بوضوح.</p>

<label for="target">الكلمة المطلوبة / Target</label>
<br><br>
<select id="target">
 <option value="lion">أسد — Lion</option>
 <option value="apple">تفاحة — Apple</option>
</select>

<button class="mic" id="micBtn" type="button" aria-label="ابدأ الاستماع">🎙️</button>
<p id="micStatus" aria-live="polite">اضغط لبدء الاستماع.</p>

<div class="box">
 <div id="heard">الكلام الذي يسمعه المتصفح سيظهر هنا.</div>
 <div id="result" aria-live="polite"></div>
</div>
<p class="hint">
قد يحتاج التعرف على الكلام إلى الإنترنت حسب المتصفح والجهاز.
اسمح باستخدام الميكروفون عند الطلب.
</p>

<script>
"use strict";

const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition;

const micBtn=document.getElementById("micBtn");
const target=document.getElementById("target");
const micStatus=document.getElementById("micStatus");
const heard=document.getElementById("heard");
const result=document.getElementById("result");

let recognition=null;
let isListening=false;
let starting=false;

function normalizeArabic(text){
 return String(text||"")
  .normalize("NFD")
  .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
  .replace(/[أإآٱ]/g,"ا")
  .replace(/ة/g,"ه")
  .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g," ")
  .replace(/\s+/g," ")
  .trim()
  .toLowerCase();
}

function isNegated(text){
 const words=normalizeArabic(text).split(/\s+/);
 // فحص النفي في بداية العبارة، وكذلك قبل الكلمة المستهدفة.
 const negations=new Set(["لا","ليس","ليست","مش","موش","مفيش","لم","لن","ما"]);
 return words.some((word,index)=>
  negations.has(word) &&
  (index===0 || index<words.length-1)
 );
}

function isExactAnswer(transcript,language){
 if(isNegated(transcript))return false;
 const answer=normalizeArabic(transcript);

 const accepted={
  lion:["اسد","الاسد"],
  apple:["تفاح","التفاح","تفاحه","التفاحه"]
 };
 return accepted[language].includes(answer);
}

function stopUI(message){
 isListening=false;
 starting=false;
 micBtn.classList.remove("listening");
 micBtn.disabled=false;
 if(message)micStatus.textContent=message;
}

function showResult(transcript){
 // استخدام textContent لمنع تفسير الكلام المتعرف عليه كـ HTML.
 heard.textContent="🗣️ قلت: "+transcript;
 const selected=target.value;

 if(isExactAnswer(transcript,selected)){
  result.textContent="✅ إجابة صحيحة!";
  result.className="good";
 }else{
  result.textContent=isNegated(transcript)
   ?"❌ العبارة تحتوي على نفي. حاول قول الكلمة المطلوبة فقط."
   :"❌ لم نتعرف على الكلمة المطلوبة. حاول مرة أخرى.";
  result.className="bad";
 }
}

if(!SpeechRecognition){
 micBtn.disabled=true;
 micStatus.textContent=
  "هذا المتصفح لا يدعم التعرف على الكلام. جرّب Chrome بإصدار حديث.";
}else{
 recognition=new SpeechRecognition();
 recognition.lang="ar-EG";
 recognition.interimResults=false;
 recognition.continuous=false;
 recognition.maxAlternatives=3;

 recognition.onstart=()=>{
  starting=false;isListening=true;
  micBtn.disabled=false;
  micBtn.classList.add("listening");
  micStatus.textContent="جاري الاستماع...";
  result.textContent="";
 };

 recognition.onresult=(event)=>{
  const transcript=event.results?.[0]?.[0]?.transcript||"";
  showResult(transcript);
 };

 recognition.onerror=(event)=>{
  const messages={
   "not-allowed":"يرجى السماح للمتصفح باستخدام الميكروفون.",
   "service-not-allowed":"خدمة التعرف على الصوت غير متاحة.",
   "no-speech":"لم نسمع صوتًا. حاول مرة أخرى.",
   "audio-capture":"لم يتم العثور على ميكروفون متاح.",
   "network":"حدث خطأ في الشبكة أو خدمة التعرف على الصوت.",
   "aborted":"تم إيقاف الاستماع."
  };
  micStatus.textContent=messages[event.error]||("تعذر التعرف على الصوت: "+event.error);
  stopUI();
 };

 recognition.onend=()=>{
  if(isListening||starting)stopUI("انتهى الاستماع. اضغط الميكروفون للمحاولة مجددًا.");
 };

 target.addEventListener("change",()=>{
  heard.textContent="الكلام الذي يسمعه المتصفح سيظهر هنا.";
  result.textContent="";
  result.className="";
 });

 micBtn.addEventListener("click",()=>{
  if(!recognition)return;
  if(isListening){
   recognition.stop();
   return;
  }
  if(starting)return;
  try{
   starting=true;
   micBtn.disabled=true;
   micStatus.textContent="جارٍ تشغيل الميكروفون...";
   recognition.start();
  }catch(error){
   stopUI("تعذر بدء الاستماع. انتظر لحظة ثم حاول مرة أخرى.");
  }
 });
}
</script>
</body>
</html>
