<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Celia World Kids 2026</title>
<style>
  :root {
    --primary: #d4af37; /* ذهبي */
    --secondary: #e91e63; /* وردي */
    --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* أزرق ملكي */
    --card-bg: rgba(255, 255, 255, 0.1);
    --text-light: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 16px; color: var(--text-light); user-select: none;
    overflow-x: hidden;
  }

  .screen { display: none; width: 100%; max-width: 600px; margin: 0 auto; }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== Welcome & Home Screens ===== */
  .header { text-align: center; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
  
  .celia-img-container {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 4px solid var(--primary);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
    overflow: hidden;
    margin-bottom: 12px;
    background: #fff;
  }
  .celia-img-container img { width: 100%; height: 100%; object-fit: cover; }

  h1 { font-size: 26px; color: var(--primary); margin-bottom: 4px; text-shadow: 1px 1px 2px #000; }
  .copyright { font-size: 12px; color: #ddd; margin-bottom: 20px; }
  
  .instruction-box {
    background: var(--card-bg); padding: 20px; border-radius: 16px;
    text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2);
  }
  .instruction-box p { font-size: 15px; line-height: 1.6; margin-bottom: 15px; }
  .instruction-box .icon { font-size: 40px; margin-bottom: 10px; display: block; }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #f39c12);
    color: #000; font-weight: bold; font-size: 18px;
    border: none; border-radius: 30px; padding: 14px 30px;
    cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    transition: transform 0.1s;
  }
  .btn-primary:active { transform: scale(0.95); }

  .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .game-card {
    background: var(--card-bg); border: 2px solid var(--primary);
    border-radius: 16px; padding: 18px 12px; text-align: center;
    cursor: pointer; transition: transform 0.1s, background 0.2s;
  }
  .game-card:active { transform: scale(0.95); }
  .game-card.disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; }
  .game-card .icon { font-size: 36px; display: block; margin-bottom: 6px; }
  .game-card .name { font-size: 14px; font-weight: bold; }
  .game-card .soon { font-size: 10px; color: #aaa; margin-top: 4px; }

  /* ===== Game Screen ===== */
  .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .back-btn {
    background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 10px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; font-weight: bold;
  }
  .stars-display { font-size: 20px; font-weight: bold; color: #f1c40f; }

  .progress-bar { background: rgba(255,255,255,0.2); height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s ease; width: 0%; }

  .question-area { text-align: center; margin-bottom: 24px; }
  .letter-display { font-size: 80px; font-weight: bold; color: var(--primary); text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); }
  .question-prompt { font-size: 16px; color: #ddd; margin-top: 10px; }
  .speak-btn { background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 20px; padding: 4px 12px; font-size: 12px; margin-top: 10px; cursor: pointer; }

  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .choice {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px; padding: 20px 8px; font-size: 60px;
    cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 100px;
  }
  .choice:active { transform: scale(0.95); }
  .choice.correct { background: rgba(46,213,115,0.4); border-color: #2ed573; animation: pop 0.4s ease; }
  .choice.wrong { background: rgba(235,77,75,0.4); border-color: #eb4d4b; animation: shake 0.4s ease; }
  
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .feedback { text-align: center; font-size: 18px; font-weight: bold; min-height: 30px; margin-top: 10px; }
  .feedback.good { color: #2ed573; }
  .feedback.bad { color: #eb4d4b; }

  /* Win Overlay */
  .win-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .win-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  .win-box {
    background: var(--bg-gradient); border: 4px solid var(--primary);
    border-radius: 20px; padding: 30px 20px; text-align: center;
    max-width: 350px; width: 100%; box-shadow: 0 0 30px rgba(212,175,55,0.4);
  }
  .win-box .trophy { font-size: 70px; margin-bottom: 10px; display: block; }
  .win-box h2 { font-size: 24px; margin-bottom: 10px; color: var(--primary); }
  .win-box p { font-size: 16px; margin-bottom: 20px; }

  @media (max-width: 400px) {
    .choice { font-size: 45px; min-height: 80px; }
    .letter-display { font-size: 60px; }
    .celia-img-container { width: 90px; height: 90px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- WELCOME SCREEN -->
<div class="screen active" id="welcomeScreen">
  <div class="header">
    <div class="celia-img-container">
      <img src="celia.jpg" alt="Celia" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #d4af37, #e91e63)'; this.parentElement.innerHTML='<span style=\'font-size:50px; display:flex; justify-content:center; align-items:center; height:100%;\'>👧🏻</span>';">
    </div>
    <h1>Celia World Kids 2026</h1>
    <p class="copyright">© جميع الحقوق محفوظة لـ سيليا احمد محمد</p>
  </div>
  <div class="instruction-box">
    <span class="icon">🌟</span>
    <p><b>أهلاً بك يا بطل!</b><br>هيا نلعب ونتعلم الحروف والصور مع سيليا.<br>اختر الإجابة الصحيحة واجمع النجوم!</p>
    <button class="btn-primary" id="startAppBtn">ابدأ اللعب الآن</button>
  </div>
</div>

<!-- HOME SCREEN -->
<div class="screen" id="homeScreen">
  <div class="header">
    <h1>Celia World Kids</h1>
  </div>
  <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <button class="back-btn" id="backBtn">← رجوع</button>
    <span class="stars-display" id="starsDisplay">⭐ 0</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  
  <div class="question-area">
    <div class="letter-display" id="currentLetter">أ</div>
    <div class="question-prompt" id="questionPrompt">اختر الصورة التي تبدأ بحرف الألف</div>
    <button class="speak-btn" id="speakBtn">🔊 استمع</button>
  </div>
  
  <div class="choices" id="choicesContainer"></div>
  <div class="feedback" id="feedback"></div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <span class="trophy">🏆</span>
    <h2>أنت بطل!</h2>
    <p>لقد أكملت اللعبة بنجاح.</p>
    <button class="btn-primary" id="winCloseBtn">العب مرة أخرى</button>
  </div>
</div>

<script>
// ============ Data & Config ============
const T = {
  ar: {
    welcomeTitle: 'Celia World Kids 2026',
    startBtn: 'ابدأ اللعب الآن',
    homeTitle: 'اختر لعبة',
    back: '← رجوع',
    prompt: (letter) => `اختر الصورة التي تبدأ بحرف ${letter}`,
    correct: '🌟 رائع! لقد كسبت نجمة',
    wrong: '❌ حاول مرة أخرى',
    winTitle: 'أنت بطل!',
    winText: 'لقد أكملت اللعبة بنجاح.',
    playAgain: 'العب مرة أخرى',
    soon: 'قريبًا',
    stars: '⭐'
  },
  en: {
    welcomeTitle: 'Celia World Kids 2026',
    startBtn: 'Start Playing',
    homeTitle: 'Choose a Game',
    back: '← Back',
    prompt: (letter) => `Pick the picture starting with ${letter}`,
    correct: '🌟 Great! You earned a star',
    wrong: '❌ Try again',
    winTitle: 'You are a Hero!',
    winText: 'You finished the game successfully.',
    playAgain: 'Play Again',
    soon: 'Soon',
    stars: '⭐'
  }
};
let lang = 'ar';
let t = T[lang];

const GAMES = [
  { id: 'letters', icon: '🔤', ar: 'حروف وصور',   en: 'Letters & Pictures', available: true },
  { id: 'count',   icon: '🔢', ar: 'عدّ واكسب',   en: 'Count & Win',        available: false },
  { id: 'colors',  icon: '🎨', ar: 'الألوان والأشكال', en: 'Colors & Shapes', available: false },
  { id: 'animals', icon: '🐾', ar: 'الحيوانات',   en: 'Animals',            available: false },
  { id: 'fruits',  icon: '🍎', ar: 'الفواكه',     en: 'Fruits',             available: false },
  { id: 'numbers', icon: '🔟', ar: 'الأرقام',     en: 'Numbers',            available: false },
  { id: 'opposites', icon: '↔️', ar: 'المتضادات', en: 'Opposites',          available: false },
  { id: 'shapes',  icon: '⬛', ar: 'الأشكال',     en: 'Shapes',             available: false },
  { id: 'memory',  icon: '🧠', ar: 'الذاكرة',     en: 'Memory',             available: false },
  { id: 'sounds',  icon: '🔊', ar: 'الأصوات',     en: 'Sounds',             available: false },
];

const LETTERS_DATA = [
  { letter: 'أ', word: 'أسد', emoji: '🦁', choices: ['🦁', '🐱', '🐶', '🐘'], correctIndex: 0 },
  { letter: 'ب', word: 'بطة', emoji: '🦆', choices: ['🐦', '🦆', '🐔', '🦅'], correctIndex: 1 },
  { letter: 'ت', word: 'تفاح', emoji: '🍎', choices: ['🍌', '🍇', '🍎', '🍉'], correctIndex: 2 },
  { letter: 'ج', word: 'جمل', emoji: '🐪', choices: ['🐪', '🐘', '🦒', '🐎'], correctIndex: 0 },
  { letter: 'ح', word: 'حصان', emoji: '🐴', choices: ['🐮', '🐴', '🐑', '🐐'], correctIndex: 1 },
  { letter: 'خ', word: 'خروف', emoji: '🐑', choices: ['🐐', '🐕', '🐑', '🐈'], correctIndex: 2 },
  { letter: 'د', word: 'دجاجة', emoji: '🐔', choices: ['🐔', '🦃', '🦅', '🦉'], correctIndex: 0 },
  { letter: 'س', word: 'سمكة', emoji: '🐟', choices: ['🐙', '🐟', '🦈', '🐬'], correctIndex: 1 },
];

// ============ State ============
let currentIndex = 0;
let stars = 0;
let locked = false;

// ============ Audio ============
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new AudioCtx(); } catch(e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', vol = 0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playCorrect() { ensureAudio(); playTone(523, 0.1); setTimeout(() => playTone(659, 0.1), 100); setTimeout(() => playTone(784, 0.2), 200); }
function playWrong() { ensureAudio(); playTone(300, 0.15, 'sawtooth'); setTimeout(() => playTone(220, 0.2, 'sawtooth'), 120); }

function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'ar' ? 'ar-SA' : 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}

// ============ UI Logic ============
function renderHome() {
  document.getElementById('homeTitle').textContent = t.homeTitle;
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';
  
  GAMES.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card' + (game.available ? '' : ' disabled');
    card.innerHTML = `
      <span class="icon">${game.icon}</span>
      <span class="name">${lang === 'ar' ? game.ar : game.en}</span>
      ${game.available ? '' : `<div class="soon">${t.soon}</div>`}
    `;
    
    // ربط حدث الضغط بشكل مباشر لضمان عمله
    if (game.available) {
      card.onclick = function() { 
        ensureAudio(); 
        startGame(); 
      };
    }
    grid.appendChild(card);
  });
}

function startGame() {
  currentIndex = 0;
  stars = 0;
  locked = false;
  showScreen('gameScreen');
  document.getElementById('backBtn').textContent = t.back;
  updateStars();
  loadQuestion();
}

function loadQuestion() {
  if (currentIndex >= LETTERS_DATA.length) { showWin(); return; }
  
  const data = LETTERS_DATA[currentIndex];
  document.getElementById('currentLetter').textContent = data.letter;
  document.getElementById('questionPrompt').textContent = t.prompt(data.letter);
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  
  const progress = (currentIndex / LETTERS_DATA.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';

  document.getElementById('speakBtn').onclick = () => speakText(data.letter + ' ' + data.word);

  const container = document.getElementById('choicesContainer');
  container.innerHTML = '';
  data.choices.forEach((emoji, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span>${emoji}</span>`;
    btn.onclick = () => handleChoice(idx, data.correctIndex, btn);
    container.appendChild(btn);
  });
  locked = false;
}

function handleChoice(selected, correct, btn) {
  if (locked) return;
  locked = true;
  
  if (selected === correct) {
    btn.classList.add('correct');
    stars++;
    updateStars();
    document.getElementById('feedback').textContent = t.correct;
    document.getElementById('feedback').className = 'feedback good';
    playCorrect();
    speakText(lang === 'ar' ? 'أحسنت' : 'Great job');
    setTimeout(() => { currentIndex++; loadQuestion(); }, 1500);
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').textContent = t.wrong;
    document.getElementById('feedback').className = 'feedback bad';
    playWrong();
    setTimeout(() => { btn.classList.remove('wrong'); locked = false; }, 800);
  }
}

function updateStars() {
  document.getElementById('starsDisplay').textContent = `${t.stars} ${stars}`;
}

function showWin() {
  document.getElementById('winOverlay').classList.add('show');
  document.getElementById('winCloseBtn').textContent = t.playAgain;
  speakText(t.winText);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============ Event Listeners ============
// ربط زر البداية
document.getElementById('startAppBtn').onclick = function() {
  ensureAudio();
  showScreen('homeScreen');
  renderHome(); // يتم استدعاؤها هنا لرسم الأزرار بعد ظهور الشاشة
};

document.getElementById('backBtn').onclick = function() {
  showScreen('homeScreen');
  renderHome();
};

document.getElementById('winCloseBtn').onclick = function() {
  document.getElementById('winOverlay').classList.remove('show');
  startGame();
};

// Language Toggle (Long press)
let pressTimer = null;
const titleEl = document.getElementById('homeTitle');
const toggleLang = () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  renderHome();
  if (document.getElementById('gameScreen').classList.contains('active')) {
    document.getElementById('backBtn').textContent = t.back;
    document.getElementById('questionPrompt').textContent = t.prompt(LETTERS_DATA[currentIndex]?.letter || '');
    updateStars();
  }
};

titleEl.addEventListener('mousedown', () => { pressTimer = setTimeout(toggleLang, 800); });
titleEl.addEventListener('mouseup', () => clearTimeout(pressTimer));
titleEl.addEventListener('touchstart', () => { pressTimer = setTimeout(toggleLang, 800); });
titleEl.addEventListener('touchend', () => clearTimeout(pressTimer));

</script>
</body>
</html>
