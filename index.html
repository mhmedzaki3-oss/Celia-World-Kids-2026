<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Celia World Kids 2026</title>
<style>
:root {
  --blue:#2563eb;
  --pink:#ec4899;
  --yellow:#facc15;
  --white:#ffffff;
  --bg:#eff6ff;
  --text:#172554;
  --green:#16a34a;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#fce7f3,#fef3c7);
  color:var(--text);
  text-align:center;
  min-height:100vh;
}
header {
  padding:16px 12px;
  background:var(--blue);
  color:white;
  box-shadow:0 3px 12px #0002;
}
h1 { margin:5px 0; font-size:clamp(24px,5vw,36px); }
header p { margin:8px 0 0; }
.toolbar {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:14px;
}
button {
  border:0;
  border-radius:14px;
  padding:12px 18px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}
button:focus-visible {
  outline:3px solid #111827;
  outline-offset:3px;
}
.language { background:#fff; color:#1d4ed8; }
.sound { background:#fef08a; color:#713f12; }
main {
  width:min(94%,680px);
  margin:0 auto 24px;
}
.panel {
  background:#ffffffed;
  border-radius:24px;
  padding:20px;
  margin:10px 0;
  box-shadow:0 8px 25px #1e3a8a18;
}
.score {
  display:flex;
  justify-content:space-around;
  gap:10px;
  flex-wrap:wrap;
  font-size:18px;
  font-weight:bold;
}
#picture {
  min-height:180px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:12px auto;
}
#picture svg {
  width:min(100%,260px);
  height:190px;
}
#question {
  font-size:clamp(22px,4vw,30px);
  line-height:1.6;
}
.answers {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:18px;
}
.answer {
  background:#dbeafe;
  color:#1e3a8a;
  min-height:60px;
  border:3px solid transparent;
}
.answer:hover { background:#bfdbfe; }
.answer:disabled { cursor:default; opacity:1; }
.answer.correct {
  background:#dcfce7;
  border-color:#16a34a;
}
.answer.wrong {
  background:#fee2e2;
  border-color:#dc2626;
}
#feedback {
  min-height:48px;
  margin:16px 0 8px;
  font-size:21px;
  font-weight:bold;
}
#next {
  background:var(--pink);
  color:white;
  min-width:150px;
}
#progress {
  height:12px;
  background:#dbeafe;
  border-radius:20px;
  overflow:hidden;
  margin:16px 0 4px;
}
#bar {
  width:0%;
  height:100%;
  background:#22c55e;
  transition:width .3s;
}
footer { padding:15px; font-size:14px; }
[hidden] { display:none !important; }
@media(max-width:420px) {
  .panel { padding:14px; }
  .answers { gap:8px; }
  .answer { padding:10px 6px; font-size:15px; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">🌟 عالم سيليا للأطفال 🌟</h1>
  <p id="subtitle">نتعلم ونلعب ونفرح معًا!</p>
</header>

<div class="toolbar">
  <button class="language" id="languageButton">English</button>
  <button class="sound" id="soundButton">🔊 اسمع السؤال</button>
</div>

<main>
  <section class="panel">
    <div class="score">
      <span id="level">السؤال 1</span>
      <span id="stars">⭐ النجوم: 0</span>
    </div>
    <div id="progress"><div id="bar"></div></div>
  </section>

  <section class="panel" id="game">
    <div id="picture" role="img" aria-label="رسمة تعليمية"></div>
    <h2 id="question">استعد للعب!</h2>
    <div class="answers" id="answers"></div>
    <div id="feedback" aria-live="polite"></div>
    <button id="next" hidden>السؤال التالي ➜</button>
  </section>

  <section class="panel" id="result" hidden>
    <h2 id="resultTitle">أحسنت يا بطل! 🎉</h2>
    <p id="resultText"></p>
    <button id="restart" style="background:#2563eb;color:white">
      العب مرة أخرى 🔄
    </button>
  </section>
</main>

<footer id="footer">Celia World Kids 2026</footer>
<script>
  
const lessons = [
  {
    arQ: "ما اسم هذا الحيوان؟",
    enQ: "What animal is this?",
    art: "🦁",
    ar: ["أسد", "قطة", "سمكة", "أرنب"],
    en: ["Lion", "Cat", "Fish", "Rabbit"],
    correct: 0,
    arWin: "أحسنت! هذا أسد شجاع! 🦁",
    enWin: "Great! This is a brave lion! 🦁"
  },
  {
    arQ: "ما اسم هذا الحيوان الكبير؟",
    enQ: "What is this big animal?",
    art: "🐘",
    ar: ["كلب", "فيل", "عصفور", "حصان"],
    en: ["Dog", "Elephant", "Bird", "Horse"],
    correct: 1,
    arWin: "رائع! هذا فيل! 🐘",
    enWin: "Wonderful! This is an elephant! 🐘"
  },
  {
    arQ: "أي حيوان يعيش في الماء؟",
    enQ: "Which animal lives in water?",
    art: "🐬",
    ar: ["دولفين", "أسد", "قطة", "حصان"],
    en: ["Dolphin", "Lion", "Cat", "Horse"],
    correct: 0,
    arWin: "ممتاز! الدولفين يعيش في الماء! 🐬",
    enWin: "Excellent! Dolphins live in water! 🐬"
  },
  {
    arQ: "ماذا تعطينا البقرة؟",
    enQ: "What does a cow give us?",
    art: "🐄",
    ar: ["عصير", "ماء البحر", "لبن", "شاي"],
    en: ["Juice", "Sea water", "Milk", "Tea"],
    correct: 2,
    arWin: "إجابة صحيحة! البقرة تعطينا اللبن! 🥛",
    enWin: "Correct! A cow gives us milk! 🥛"
  },
  {
    arQ: "كم ضلعًا للمثلث؟",
    enQ: "How many sides does a triangle have?",
    art: "🔺",
    ar: ["ضلعان", "ثلاثة أضلاع", "أربعة أضلاع", "خمسة أضلاع"],
    en: ["Two", "Three", "Four", "Five"],
    correct: 1,
    arWin: "برافو! للمثلث ثلاثة أضلاع! 🔺",
    enWin: "Bravo! A triangle has three sides! 🔺"
  },
  {
    arQ: "ما لون الموز الناضج عادةً؟",
    enQ: "What color is a ripe banana usually?",
    art: "🍌",
    ar: ["أزرق", "أصفر", "بنفسجي", "أسود"],
    en: ["Blue", "Yellow", "Purple", "Black"],
    correct: 1,
    arWin: "ممتاز! الموز الناضج أصفر! 🍌",
    enWin: "Excellent! A ripe banana is yellow! 🍌"
  },
  {
    arQ: "أي حيوان يستطيع الطيران؟",
    enQ: "Which animal can fly?",
    art: "🦋",
    ar: ["فراشة", "فيل", "سمكة", "بقرة"],
    en: ["Butterfly", "Elephant", "Fish", "Cow"],
    correct: 0,
    arWin: "أحسنت! الفراشة تستطيع الطيران! 🦋",
    enWin: "Well done! A butterfly can fly! 🦋"
  },
  {
    arQ: "أين يعيش السمك؟",
    enQ: "Where do fish live?",
    art: "🐟",
    ar: ["على الشجرة", "في الماء", "في الصحراء", "فوق السحاب"],
    en: ["In a tree", "In water", "In a desert", "In the clouds"],
    correct: 1,
    arWin: "رائع! السمك يعيش في الماء! 🐟",
    enWin: "Great! Fish live in water! 🐟"
  }
];

let language = "ar";
let index = 0;
let score = 0;
let answered = false;
let earnedQuestions = new Set();

const $ = id => document.getElementById(id);

function speak(text) {
  if (!("speechSynthesis" in window)) {
    $("feedback").textContent =
      language === "ar"
        ? "الصوت غير مدعوم في هذا المتصفح."
        : "Speech is not supported by this browser.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = language === "ar" ? "ar-EG" : "en-US";
  utterance.rate = 0.85;
  utterance.pitch = 1.15;

  const voices = window.speechSynthesis.getVoices();
  const matchingVoice = voices.find(v =>
    language === "ar"
      ? v.lang.toLowerCase().startsWith("ar")
      : v.lang.toLowerCase().startsWith("en")
  );

  if (matchingVoice) utterance.voice = matchingVoice;

  window.speechSynthesis.speak(utterance);
}

function render() {
  const q = lessons[index];
  answered = false;

  $("title").textContent =
    language === "ar"
      ? "🌟 عالم سيليا للأطفال 🌟"
      : "🌟 Celia World Kids 🌟";

  $("subtitle").textContent =
    language === "ar"
      ? "نتعلم ونلعب ونفرح معًا!"
      : "Learn, play, and have fun together!";

  $("languageButton").textContent =
    language === "ar" ? "English" : "العربية";

  $("soundButton").textContent =
    language === "ar" ? "🔊 اسمع السؤال" : "🔊 Hear the question";

  $("level").textContent =
    language === "ar"
      ? `السؤال ${index + 1} من ${lessons.length}`
      : `Question ${index + 1} of ${lessons.length}`;

  $("stars").textContent =
    language === "ar"
      ? `⭐ النجوم: ${score}`
      : `⭐ Stars: ${score}`;

  $("question").textContent = language === "ar" ? q.arQ : q.enQ;
  $("picture").textContent = q.art;
  $("picture").style.fontSize = "110px";
  $("picture").style.lineHeight = "1.5";
  $("picture").setAttribute(
    "aria-label",
    language === "ar" ? q.arQ : q.enQ
  );

  $("bar").style.width = `${(index / lessons.length) * 100}%`;
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("answers").replaceChildren();

  const choices = language === "ar" ? q.ar : q.en;

  choices.forEach((choice, choiceIndex) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = choice;
    button.addEventListener("click", () => checkAnswer(choiceIndex));
    $("answers").appendChild(button);
  });

  $("game").hidden = false;
  $("result").hidden = true;

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
}

function checkAnswer(choiceIndex) {
  if (answered) return;
  answered = true;

  const q = lessons[index];
  const buttons = $("answers").querySelectorAll("button");
  buttons.forEach(button => button.disabled = true);

  if (choiceIndex === q.correct) {
    buttons[choiceIndex].classList.add("correct");

    if (!earnedQuestions.has(index)) {
      earnedQuestions.add(index);
      score++;
    }

    $("feedback").textContent =
      language === "ar" ? q.arWin : q.enWin;

    speak(language === "ar" ? q.arWin : q.enWin);
  } else {
    buttons[choiceIndex].classList.add("wrong");
    buttons[q.correct].classList.add("correct");

    $("feedback").textContent =
      language === "ar"
        ? "حاول مرة أخرى في السؤال القادم! 🌈"
        : "Try again on the next question! 🌈";
  }

  $("stars").textContent =
    language === "ar"
      ? `⭐ النجوم: ${score}`
      : `⭐ Stars: ${score}`;

  $("next").hidden = false;
  $("next").textContent =
    index === lessons.length - 1
      ? (language === "ar" ? "عرض النتيجة 🏆" : "See results 🏆")
      : (language === "ar" ? "السؤال التالي ➜" : "Next question ➜");
}

function showResults() {
  window.speechSynthesis?.cancel();
  $("game").hidden = true;
  $("result").hidden = false;
  $("bar").style.width = "100%";

  $("resultTitle").textContent =
    language === "ar" ? "أحسنت يا بطل! 🎉" : "Well done! 🎉";

  $("resultText").textContent =
    language === "ar"
      ? `جمعت ${score} من ${lessons.length} نجوم. استمر في التعلم واللعب!`
      : `You earned ${score} out of ${lessons.length} stars. Keep learning and playing!`;

  $("restart").textContent =
    language === "ar" ? "العب مرة أخرى 🔄" : "Play again 🔄";

  speak($("resultText").textContent);
}

function nextQuestion() {
  if (index < lessons.length - 1) {
    index++;
    render();
  } else {
    showResults();
  }
}

function restartGame() {
  index = 0;
  score = 0;
  earnedQuestions = new Set();
  window.speechSynthesis?.cancel();
  render();
}

$("languageButton").addEventListener("click", () => {
  language = language === "ar" ? "en" : "ar";
  window.speechSynthesis?.cancel();

  if ($("result").hidden) {
    render();
  } else {
    showResults();
  }
});

$("soundButton").addEventListener("click", () => {
  const q = lessons[index];
  speak(language === "ar" ? q.arQ : q.enQ);
});

$("next").addEventListener("click", nextQuestion);
$("restart").addEventListener("click", restartGame);

render();
</script>
</body>
</html>
