<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a90e2">
<title>Celia World Kids 2026</title>
<style>
:root{--p:#3478d4;--s:#f3a712;--bg:#f3f7fc;--fg:#203047;--card:#fff;--ok:#16864b;--bad:#c73535}
[data-theme="dark"]{--bg:#141923;--fg:#f0f3f8;--card:#242d3b;--p:#5c9ce6}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.screen{display:none;min-height:100vh;padding:18px;max-width:760px;margin:auto}
.screen.active{display:block}
#screen-home.active{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover{width:150px;height:150px;border:5px solid var(--s);border-radius:50%;margin-bottom:20px;background:white}
.btn{border:0;border-radius:14px;background:var(--p);color:white;padding:12px 18px;font-weight:bold}
.btn.secondary{background:var(--s);color:#222}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wide{width:100%;max-width:320px;margin:8px auto;display:block}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card,.choice,.question{background:var(--card);color:var(--fg);border-radius:16px;padding:18px;text-align:center;border:2px solid transparent;box-shadow:0 3px 10px #00000012}
.card{font-size:19px;min-height:115px}
.card .emoji{font-size:38px;display:block;margin-bottom:10px}
.question{font-size:clamp(28px,7vw,55px);margin:18px 0;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{font-size:34px;min-width:0}
.choice.correct{border-color:var(--ok);background:#16864b20}
.choice.wrong{border-color:var(--bad);background:#c7353520}
.choice:disabled{opacity:.65}
.note{text-align:center;min-height:32px;margin:15px 0;font-weight:bold}
.good{color:var(--ok)}.bad{color:var(--bad)}
.small{font-size:14px;opacity:.8;text-align:center}
[hidden]{display:none!important}
@media(max-width:380px){.screen{padding:12px}.card,.choice{padding:12px}.grid{gap:9px}}
</style>
</head>
<body>
<section class="screen active" id="screen-home">
<svg class="cover" viewBox="0 0 100 100" role="img" aria-label="Celia">
 <circle cx="50" cy="50" r="49" fill="#fce4ec"/>
 <path d="M23 42 Q17 10 43 24 Q60 5 78 36 L72 61 L28 61Z" fill="#795548"/>
 <ellipse cx="50" cy="47" rx="25" ry="28" fill="#ffcc80"/>
 <circle cx="41" cy="44" r="2.5"/><circle cx="59" cy="44" r="2.5"/>
 <path d="M43 56 Q50 62 57 56" fill="none" stroke="#5d4037" stroke-width="2"/>
 <path d="M15 100 Q50 67 85 100" fill="#4a90e2"/>
</svg>
<h1 data-ar="عالم سيليا للأطفال" data-en="Celia World Kids">عالم سيليا للأطفال</h1>
<p data-ar="نتعلم ونلعب ونكسب النجوم!" data-en="Learn, play and earn stars!">نتعلم ونلعب ونكسب النجوم!</p>
<button class="btn wide" id="startBtn">ابدأ الآن 🚀</button>
<button class="btn secondary wide" id="langBtn">English</button>
<button class="btn wide" id="themeBtn">🌙 الوضع الداكن</button>
</section>

<section class="screen" id="screen-games">
 <div class="header">
  <button class="btn" id="homeBtn">الرئيسية</button>
  <h2 data-ar="اختر لعبة" data-en="Choose a game">اختر لعبة</h2>
  <span id="menuStars">⭐ 0</span>
 </div>
 <div class="grid" id="gamesGrid"></div>
</section>

<section class="screen" id="screen-play">
 <div class="header">
  <button class="btn" id="exitBtn">خروج</button>
  <strong id="scoreDisplay">⭐ النجوم: 0</strong>
 </div>
 <div id="gameContent"></div>
 <p class="small" data-ar="النجوم محفوظة على هذا الجهاز فقط." data-en="Stars are saved on this device only.">النجوم محفوظة على هذا الجهاز فقط.</p>
</section>

<script>
"use strict";

const $ = id => document.getElementById(id);
const T = {
 ar:{start:"ابدأ الآن 🚀",home:"الرئيسية",exit:"خروج",stars:"النجوم: ",
 match:"المطابقة",memory:"الذاكرة",counting:"العد",choose:"اختر لعبة",
 target:"اختر الشكل المطابق",apples:"كم عدد التفاحات؟",retry:"حاول مرة أخرى",
 correct:"أحسنت! إجابة صحيحة 🎉",finished:"أحسنت! أكملت اللعبة 🎉",
 memoryHelp:"اعثر على الأزواج المتشابهة",countDone:"انتهت الجولات العشر!",
 themeDark:"🌙 الوضع الداكن",themeLight:"☀️ الوضع الفاتح",
 homeTitle:"عالم سيليا للأطفال",intro:"نتعلم ونلعب ونكسب النجوم!"},
 en:{start:"Start Now 🚀",home:"Home",exit:"Exit",stars:"Stars: ",
 match:"Match",memory:"Memory",counting:"Counting",choose:"Choose a game",
 target:"Find the matching symbol",apples:"How many apples?",
 retry:"Try again",correct:"Well done! Correct answer 🎉",
 finished:"Great job! Game completed 🎉",memoryHelp:"Find matching pairs",
 countDone:"All 10 rounds completed!",themeDark:"🌙 Dark mode",
 themeLight:"☀️ Light mode",homeTitle:"Celia World Kids",
 intro:"Learn, play and earn stars!"}
};
let lang="ar", activeGame=null;
let progress={totalStars:0};
let state={};
const games=[
 {id:"match",icon:"🎯"},
 {id:"memory",icon:"🧠"},
 {id:"counting",icon:"🔢"}
];

function loadProgress(){
 try{
  const p=JSON.parse(localStorage.getItem("celia_kids_final")||"{}");
  if(Number.isSafeInteger(p.totalStars)&&p.totalStars>=0)
   progress.totalStars=p.totalStars;
 }catch(e){progress.totalStars=0;}
}
function saveProgress(){
 try{localStorage.setItem("celia_kids_final",JSON.stringify(progress));}
 catch(e){console.warn("تعذر حفظ التقدم على هذا الجهاز.");}
}
function awardStar(){
 if(!Number.isSafeInteger(progress.totalStars))progress.totalStars=0;
 progress.totalStars++;
 saveProgress();
 updateStars();
}
function updateStars(){
 $("scoreDisplay").textContent=T[lang].stars+progress.totalStars;
 $("menuStars").textContent="⭐ "+progress.totalStars;
}
function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
}
function applyLanguage(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-ar][data-en]").forEach(el=>{
  el.textContent=el.dataset[lang];
 });
 $("startBtn").textContent=T[lang].start;
 $("langBtn").textContent=lang==="ar"?"English":"العربية";
 $("homeBtn").textContent=T[lang].home;
 $("exitBtn").textContent=T[lang].exit;
 $("themeBtn").textContent=document.documentElement.dataset.theme==="dark"
  ?T[lang].themeLight:T[lang].themeDark;
 updateStars();
 renderGamesMenu();
 // تحديث نصوص اللعبة الحالية دون إعادة تشغيلها أو فقد تقدمها.
 if(activeGame==="match"||activeGame==="counting") renderCurrentQuestionLanguage();
 if(activeGame==="memory"){
  const help=$("memoryHelp");
  if(help)help.textContent=T[lang].memoryHelp;
 }
}
function renderCurrentQuestionLanguage(){
 const title=$("questionTitle");
 if(title)title.textContent=activeGame==="match"?T[lang].target:T[lang].apples;
 const status=$("gameStatus");
 if(status&&status.dataset.msg==="retry")status.textContent=T[lang].retry;
 if(status&&status.dataset.msg==="correct")status.textContent=T[lang].correct;
 if(status&&status.dataset.msg==="finished")status.textContent=T[lang].countDone;
}
function renderGamesMenu(){
 const grid=$("gamesGrid");
 if(!grid)return;
 grid.replaceChildren();
 games.forEach(g=>{
  const b=document.createElement("button");
  b.className="card";
  const icon=document.createElement("span");
  icon.className="emoji";icon.textContent=g.icon;
  const name=document.createElement("span");
  name.textContent=T[lang][g.id];
  b.append(icon,name);
  b.addEventListener("click",()=>openGame(g.id));
  grid.appendChild(b);
 });
}
function startApp(){renderGamesMenu();showScreen("screen-games");}
function goHome(){activeGame=null;showScreen("screen-home");}
function closeGame(){activeGame=null;renderGamesMenu();showScreen("screen-games");}
function openGame(id){
 activeGame=id;
 state={answered:false};
 if(id==="counting")state.countRound=1;
 showScreen("screen-play");
 updateStars();
 if(id==="match")startMatchGame();
 if(id==="memory")startMemoryGame();
 if(id==="counting")startCountingGame();
}

function statusNode(){
 const p=document.createElement("p");
 p.className="note";p.id="gameStatus";p.setAttribute("aria-live","polite");
 return p;
}
function makeQuestion(text){
 const d=document.createElement("div");
 d.className="question";d.textContent=text;return d;
}
function makeChoice(text,onClick){
 const b=document.createElement("button");
 b.className="choice";b.type="button";b.textContent=text;
 b.addEventListener("click",()=>onClick(b));
 return b;
}

// لعبة المطابقة: الإجابة الخاطئة تسمح بالمحاولة، والصحيحة تحتسب مرة واحدة.
function startMatchGame(){
 state.answered=false;
 const all=["🦁","🐶","🍎","🚗","🐱","🍌","✈️","🐸"];
 const target=all[Math.floor(Math.random()*4)];
 const opts=[target,...all.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)]
  .sort(()=>Math.random()-.5);
 const root=$("gameContent");root.replaceChildren();
 const title=document.createElement("h2");title.id="questionTitle";
 title.textContent=T[lang].target;root.appendChild(title);
 root.appendChild(makeQuestion(target));
 const choices=document.createElement("div");choices.className="choices";
 const status=statusNode();root.appendChild(choices);root.appendChild(status);
 opts.forEach(opt=>choices.appendChild(makeChoice(opt,button=>{
  if(state.answered)return;
  if(opt!==target){
   button.classList.add("wrong");button.disabled=true;
   status.textContent=T[lang].retry;status.dataset.msg="retry";
   return;
  }
  state.answered=true;button.classList.add("correct");awardStar();
  choices.querySelectorAll("button").forEach(b=>b.disabled=true);
  status.textContent=T[lang].correct;status.dataset.msg="correct";
  setTimeout(()=>{if(activeGame==="match")startMatchGame();},900);
 })));
}

// لعبة الذاكرة: كل زوج يحتسب مرة، والقفل يمنع النقر أثناء كشف الزوج.
function startMemoryGame(){
 const emojis=["🐶","🐱","🐭","🐹"];
 const cards=[...emojis,...emojis].sort(()=>Math.random()-.5);
 let flipped=[],locked=false,matches=0;
 const root=$("gameContent");root.replaceChildren();
 const help=document.createElement("h2");help.id="memoryHelp";
 help.textContent=T[lang].memoryHelp;root.appendChild(help);
 const board=document.createElement("div");
 board.className="choices";board.style.gridTemplateColumns="repeat(4,minmax(0,1fr))";
 root.appendChild(board);
 const status=statusNode();root.appendChild(status);
 cards.forEach((emoji,index)=>{
  const b=makeChoice("❓",button=>{
   if(locked||button.dataset.matched==="true"||flipped.includes(button))return;
   button.textContent=emoji;flipped.push(button);
   if(flipped.length!==2)return;
   locked=true;
   const [a,c]=flipped;
   if(a.textContent===c.textContent){
    [a,c].forEach(card=>{
     card.dataset.matched="true";card.classList.add("correct");card.disabled=true;
    });
    matches++;awardStar();flipped=[];locked=false;
    if(matches===emojis.length){
     status.textContent=T[lang].finished;status.dataset.msg="finished";
    }
   }else{
    setTimeout(()=>{
     [a,c].forEach(card=>{card.textContent="❓";});
     flipped=[];locked=false;
    },850);
   }
  });
  b.id="mem-"+index;b.style.fontSize="30px";b.style.padding="12px 2px";
  board.appendChild(b);
 });
}

// لعبة العد: 10 جولات بالضبط؛ الجولة منفصلة عن إجمالي النجوم.
function startCountingGame(){
 if(state.countRound>10){
  const root=$("gameContent");root.replaceChildren();
  const done=document.createElement("h2");done.className="note good";
  done.textContent=T[lang].countDone;root.appendChild(done);
  const result=document.createElement("p");result.className="note";
  result.textContent=T[lang].finished;root.appendChild(result);
  return;
 }
 state.answered=false;
 const n=state.countRound,root=$("gameContent");root.replaceChildren();
 const title=document.createElement("h2");title.id="questionTitle";
 title.textContent=T[lang].apples+" ("+n+"/10)";root.appendChild(title);
 root.appendChild(makeQuestion("🍎".repeat(n)));
 const choices=document.createElement("div");choices.className="choices";
 const status=statusNode();root.appendChild(choices);root.appendChild(status);
 let opts=new Set([n]);
 while(opts.size<3){
  const candidate=Math.max(1,Math.min(10,n+(Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*3))));
  opts.add(candidate);
 }
 [...opts].sort(()=>Math.random()-.5).forEach(value=>{
  choices.appendChild(makeChoice(String(value),button=>{
   if(state.answered)return;
   if(value!==n){
    button.classList.add("wrong");button.disabled=true;
    status.textContent=T[lang].retry;status.dataset.msg="retry";return;
   }
   state.answered=true;button.classList.add("correct");
   choices.querySelectorAll("button").forEach(b=>b.disabled=true);
   awardStar();status.textContent=T[lang].correct;status.dataset.msg="correct";
   setTimeout(()=>{
    if(activeGame!=="counting")return;
    state.countRound++;startCountingGame();
   },650);
  }));
 });
}

$("startBtn").addEventListener("click",startApp);
$("homeBtn").addEventListener("click",goHome);
$("exitBtn").addEventListener("click",closeGame);
$("langBtn").addEventListener("click",()=>{
 lang=lang==="ar"?"en":"ar";applyLanguage();
});
$("themeBtn").addEventListener("click",()=>{
 const el=document.documentElement;
 el.dataset.theme=el.dataset.theme==="dark"?"light":"dark";
 applyLanguage();
});

loadProgress();
applyLanguage();
</script>
</body>
</html>
