<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Celia World Kids 2026</title>
<style>
:root{--bg:#f2f7ff;--card:#fff;--ink:#172554;--muted:#64748b;--blue:#2563eb;--pink:#ec4899;--line:#dbeafe}
[data-theme=dark]{--bg:#0b1220;--card:#142039;--ink:#eff6ff;--muted:#bdc9df;--blue:#60a5fa;--pink:#f472b6;--line:#344563}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Tahoma,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:14px}.hero{padding:22px;border-radius:22px;color:white;background:linear-gradient(120deg,#2563eb,#7c3aed,#ec4899)}
h1,h2,h3,p{margin-top:0}.hero h1{margin-bottom:5px}.tools,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,select{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:var(--blue);color:white;font-weight:bold}
.secondary{background:var(--line);color:var(--ink)}.pink{background:var(--pink)}button:disabled{opacity:.5}
.stats,.games,.discovery,.stories{display:grid;gap:11px}.stats{grid-template-columns:repeat(3,1fr);margin:14px 0}
.games{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.discovery,.stories{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card,.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}
.stat{text-align:center}.stat strong{display:block;color:var(--blue);font-size:1.45rem}
.game{display:flex;flex-direction:column;gap:7px}.game .emoji{font-size:2rem}.game p{color:var(--muted);flex:1;margin:0}.game button{width:100%}
h2{margin:23px 0 10px}.hidden{display:none!important}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:9px;margin:12px 0}
.choice{background:var(--card);color:var(--ink);border:2px solid var(--line);min-height:64px;font-size:1.2rem}
.feedback{min-height:28px;font-weight:bold}.ok{color:#16a34a}.bad{color:#dc2626}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#ec4899)}
.tilegrid{display:grid;grid-template-columns:repeat(3,minmax(60px,100px));gap:5px;justify-content:center}
.tile{aspect-ratio:1;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:2rem;padding:3px}
.maze{display:grid;grid-template-columns:repeat(5,minmax(35px,55px));gap:4px;justify-content:center}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:var(--line);font-size:1.3rem}
.wall{background:#334155}.paint{width:100%;height:260px;background:white;border:2px solid var(--line);border-radius:12px;touch-action:none}
.story p{white-space:pre-line}.big{font-size:2.2rem}.notice{margin-top:20px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
a{color:var(--blue)}footer{text-align:center;color:var(--muted);font-size:.85rem;margin:20px}
@media(max-width:500px){.wrap{padding:9px}.hero{padding:16px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}}
</style>
</head>

<div class="wrap">
<header class="hero">
<h1>🌈 Celia World Kids 2026</h1>
<p id="tagline">عالم سيليا: نتعلّم ونلعب ونكتشف!</p>
<div class="tools">
<button id="lang" class="secondary">English</button>
<button id="theme" class="secondary">🌙 الوضع الداكن</button>
<button id="sound" class="secondary">🔊 الصوت يعمل</button>
<button id="reset" class="secondary">إعادة التقدم</button>
</div>
</header>

<div class="stats">
<div class="stat"><span id="completedLabel">الألعاب المكتملة</span><strong id="completed">0 / 10</strong></div>
<div class="stat"><span id="starsLabel">النجوم</span><strong id="stars">0 ⭐</strong></div>
<div class="stat"><span id="progressLabel">التقدم</span><strong id="percent">0%</strong></div>
</div>
<div class="bar"><span id="progressBar"></span></div>

<h2 id="gamesTitle">🎮 الألعاب التعليمية</h2>
<div id="games" class="games"></div>

<section id="area" class="panel hidden" style="margin-top:16px">
<div class="tools" style="justify-content:space-between;margin:0">
<h2 id="gameTitle" style="margin:0"></h2><button id="close" class="secondary">✕ إغلاق</button>
</div>
<div id="play"></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div class="actions">
<button id="next" class="hidden">السؤال التالي</button>
<button id="finish" class="hidden">إنهاء اللعبة ✓</button>
</div>
</section>

<h2 id="discoverTitle">🦁 عالم الاكتشاف</h2>
<div id="discovery" class="discovery"></div>
<h2 id="storiesTitle">📚 20 قصة قصيرة</h2>
<div id="stories" class="stories"></div>

<div class="notice">
<strong>نسخة تعليمية تجريبية</strong><br>
للاستفسار عن الشراء عبر واتساب:
<a href="https://wa.me/201022918830?text=أرغب%20في%20شراء%20Celia%20World%20Kids%202026" target="_blank" rel="noopener">01022918830</a>
</div>
<footer>تُحفظ النجوم والتقدم محليًا في هذا المتصفح. لا تدخل بيانات شخصية للطفل.</footer>
</div>

function persist(){try{localStorage.setItem(KEY,JSON.stringify({completed:S.completed,stars:S.stars,read:S.read,lang:S.lang,theme:S.theme}));}catch(e){feedback("تعذر حفظ التقدم في هذا المتصفح.","bad");}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"{}");S.completed=Array.isArray(x.completed)?x.completed.filter(id=>games.some(g=>g[0]===id)):[];S.stars=Number.isFinite(x.stars)?x.stars:0;S.read=Array.isArray(x.read)?x.read:[];S.lang=x.lang==="en"?"en":"ar";S.theme=x.theme==="dark"?"dark":"light";}catch(e){}}

function render(){

$("discovery").querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>say(decodeURIComponent(b.dataset.speak)));
$("stories").innerHTML=stories.map((s,i)=>`<article class="card story"><h3>${i+1}. ${S.lang==="ar"?s[0]:s[2]} ${S.read.includes(i)?"⭐":""}</h3><p>${S.lang==="ar"?s[1]:s[3]}</p><div class="actions"><button class="secondary" data-story="${i}">${T("listen")}</button><button class="pink" data-read="${i}">${S.read.includes(i)?T("read"):(S.lang==="ar"?"تمت القراءة؟":"Mark as read")}</button></div></article>`).join("");
$("stories").querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>{let s=stories[+b.dataset.story];say(S.lang==="ar"?s[0]+". "+s[1]:s[2]+". "+s[3]);});
$("stories").querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{let i=+b.dataset.read;if(!S.read.includes(i))S.read.push(i);persist();render();});
}
function start(id){S.game=id;S.round=0;S.score=0;S.deck=[];S.matched=[];S.selected=[];S.pos=0;S.answer=null;$("area").classList.remove("hidden");$("gameTitle").textContent=tr[S.lang].titles[games.findIndex(g=>g[0]===id)];$("feedback").textContent="";drawRound();$("area").scrollIntoView({behavior:"smooth"});}
function choices(items,cb){let d=document.createElement("div");d.className="choices";items.forEach((v,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>cb(i);d.appendChild(b)});$("play").appendChild(d);}

function answer(ok){if(ok){S.score++;feedback(T("right"),"ok");say(S.lang==="ar"?"أحسنت":"Correct");}else{feedback(T("wrong"),"bad");}}

let id=S.game;let p=$("play");p.innerHTML="";$("next").classList.add("hidden");$("finish").classList.add("hidden");$("feedback").textContent="";
if(["letters","colors","count","habitats","odd","pattern"].includes(id)){
let q=quiz[id][S.round%quiz[id].length];let h=document.createElement("h3");h.textContent=q[0];p.appendChild(h);
if(id==="count"){let n=(S.round%10)+1;h.textContent=S.lang==="ar"?"عد الأشياء واختر الرقم الصحيح":"Count the objects";let em=["🍎","⭐","🐟","🦋","🌼","🚗","🎈","🍓","🐥","⚽"][n-1];let visual=document.createElement("div");visual.style.fontSize="1.8rem";visual.textContent=Array(n).fill(em).join(" ");p.appendChild(visual);let opts=[n,Math.max(1,n-1),Math.min(10,n+1)].sort(()=>Math.random()-.5);choices(opts.map(String),i=>{if(opts[i]===n){answer(true);nextOrFinish()}else answer(false)});return;}
if(id==="pattern")h.textContent=T("pattern");
choices(q[1],i=>{if(i===q[2]){answer(true);nextOrFinish();if(id==="odd"){let d=document.createElement("p");d.textContent=S.lang==="ar"?"ثلاثة عناصر تنتمي إلى مجموعة واحدة.":"Three items belong together.";p.appendChild(d);}}else answer(false);});return;
}
if(id==="memory"){
if(!S.deck.length)S.deck=["🐱","🐶","🐼","🦊","🐸","🐵","🐱","🐶","🐼","🦊","🐸","🐵"].sort(()=>Math.random()-.5);
p.innerHTML=`<p>${S.lang==="ar"?"اكشف بطاقتين متطابقتين. تبقى الأزواج الصحيحة ظاهرة.":"Reveal two matching cards. Matched pairs stay visible."}</p><div id="mem" class="choices"></div>`;
let grid=$("mem");S.deck.forEach((v,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=S.matched.includes(i)||S.selected.includes(i)?v:"❔";b.disabled=S.matched.includes(i)||S.selected.includes(i)||S.selected.length>=2;b.onclick=()=>{S.selected.push(i);drawRoundMemory();};grid.appendChild(b)});
return;
}
if(id==="puzzle"){
let target=["🐱","🐶","🦊","🐼","🐸","🐵","🐰","🐨","🦁"];
if(!S.deck.length)S.deck=target.map((v,i)=>({v,i})).sort(()=>Math.random()-.5);
p.innerHTML=`<p>${S.lang==="ar"?"بدّل المربعات حتى تصبح الصور مرتبة من 1 إلى 9.":"Swap tiles until the pictures are in order from 1 to 9."}</p><div id="puzzle" class="tilegrid"></div>`;
S.deck.forEach((x,i)=>{let b=document.createElement("button");b.className="tile";b.textContent=x.v;b.onclick=()=>{if(S.answer===null){S.answer=i;b.style.borderColor="var(--pink)";}else{[S.deck[S.answer],S.deck[i]]=[S.deck[i],S.deck[S.answer]];S.answer=null;drawRound();if(S.deck.every((v,j)=>v.i===j)){S.score=3;feedback(T("right"),"ok");$("finish").classList.remove("hidden");}}};$("puzzle").appendChild(b)});return;
}
if(id==="maze"){
let walls=new Set([2,7,11,13,17,22]);
p.innerHTML=`<p>${T("maze")}</p><div class="maze" id="maze"></div><div class="choices"><button class="choice" data-m="up">⬆️</button><button class="choice" data-m="left">⬅️</button><button class="choice" data-m="down">⬇️</button><button class="choice" data-m="right">➡️</button></div>`;
function paint(){let g=$("maze");g.innerHTML="";for(let i=0;i<25;i++){let d=document.createElement("div");d.className="cell"+(walls.has(i)?" wall":"");d.textContent=i===S.pos?"🤖":i===24?"⭐":"";g.appendChild(d)}}paint();
p.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{let r=Math.floor(S.pos/5),c=S.pos%5,m=b.dataset.m;if(m==="up")r--;if(m==="down")r++;if(m==="left")c--;if(m==="right")c++;if(r<0||r>4||c<0||c>4)return;let n=r*5+c;if(walls.has(n))return;S.pos=n;paint();if(n===24){S.score=3;feedback(T("right"),"ok");$("finish").classList.remove("hidden");}});return;
}
if(id==="draw"){
p.innerHTML=`<p>${tr[S.lang].descs[9]}</p><div class="tools"><input id="color" type="color" value="#2563eb"><button id="clear" class="secondary">${T("clear")}</button><button id="savepic">${T("save")}</button></div><canvas id="canvas" class="paint" width="900" height="420"></canvas>`;
let c=$("canvas"),ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
try{let saved=localStorage.getItem(KEY+"_drawing");if(saved){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=saved;}}catch(e){}
ctx.lineWidth=8;ctx.lineCap="round";let drawing=false;
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);let a=point(e);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.strokeStyle=$("color").value};
c.onpointermove=e=>{if(!drawing)return;let a=point(e);ctx.lineTo(a.x,a.y);ctx.stroke()};
c.onpointerup=c.onpointercancel=()=>drawing=false;
$("clear").onclick=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height)};
$("savepic").onclick=()=>{try{localStorage.setItem(KEY+"_drawing",c.toDataURL());S.score=1;feedback(S.lang==="ar"?"تم حفظ الرسم. اضغط إنهاء اللعبة لاحتسابها.":"Drawing saved. Press Finish to complete the game.","ok");$("finish").classList.remove("hidden");}catch(e){feedback("تعذر حفظ الرسم.","bad")}};return;
}
}
function drawRoundMemory(){
let old=S.selected.slice();
if(old.length===2){if(S.deck[old[0]]===S.deck[old[1]]){S.matched.push(...old);S.score++;S.selected=[];if(S.matched.length===S.deck.length){feedback(T("right"),"ok");$("finish").classList.remove("hidden");}else drawRound();}else{feedback(T("wrong"),"bad");setTimeout(()=>{S.selected=[];drawRound()},700)}return;}
drawRound();
}
function complete(){
if(!S.game)return;
if(!S.completed.includes(S.game)){S.completed.push(S.game);S.stars+=Math.max(1,S.score);persist();render();feedback(T("complete"),"ok");say(S.lang==="ar"?"أحسنت!":"Well done!");}
else feedback(S.lang==="ar"?"أنهيت هذه اللعبة سابقًا. يمكنك اللعب مجددًا.":"You already completed this game. You can play again.","ok");
$("finish").classList.add("hidden");$("next").classList.add("hidden");
}
$("next").onclick=()=>{S.round++;drawRound()};
$("finish").onclick=complete;
$("close").onclick=()=>{$("area").classList.add("hidden");S.game=null};
$("lang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";persist();render();if(S.game){$("gameTitle").textContent=tr[S.lang].titles[games.findIndex(g=>g[0]===S.game)];drawRound()}};
$("theme").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";persist();render()};
$("sound").onclick=()=>{S.sound=!S.sound;render()};
$("reset").onclick=()=>{if(confirm(T("resetAsk"))){S.completed=[];S.stars=0;S.read=[];persist();render();feedback(S.lang==="ar"?"تمت إعادة التقدم.":"Progress reset.","ok")}};
load();render();
</script>
</body>
</html>
